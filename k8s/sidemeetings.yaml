apiVersion: apps/v1
kind: Deployment
metadata:
  name: sidemeetings
  labels:
    appclass: light
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: sidemeetings
  template:
    metadata:
      labels:
        app: sidemeetings
        appclass: light
        workload: app
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - image: 'ghcr.io/ietf-tools/sidemeetings:$APP_IMAGE_TAG'
          imagePullPolicy: Always
          name: sidemeetings
          ports:
            - containerPort: 3000
              name: http
              protocol: TCP
          envFrom:
            - secretRef:
                name: sidemeetings-secrets-env
          env:
            - name: 'BACKEND_PORT'
              value: '3000'
            # ensures the pod gets recreated on every deploy:
            - name: 'DEPLOY_UID'
              value: '$DEPLOY_UID'
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsUser: 1000
            runAsGroup: 1000
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 2048Mi
      restartPolicy: Always
      terminationGracePeriodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: sidemeetings
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      protocol: TCP
      targetPort: http
  selector:
    app: sidemeetings
